# Self-hosted Sesame server: the API, its database, the account portal, the
# administration portal, and a local mail catcher.
#
# Every value comes from the .env file `npm run setup` writes beside this one.
# No Sesame-owned key, domain, or account is involved: a deployment generates
# its own secrets and serves its own portals.
#
#   npm run setup
#   docker compose -f deploy/compose/compose.yaml up --build
#
# The public marketing site is deliberately absent. It is a static site that
# reads published metadata anonymously, and a server does not need it.

name: sesame-server

services:
  migrate:
    build:
      context: ${SESAME_SERVER_CONTEXT}
    entrypoint: ["/sesame-migrate"]
    environment:
      DATABASE_URL: postgres://sesame:${SESAME_DATABASE_PASSWORD}@db:5432/sesame?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ${SESAME_SERVER_CONTEXT}
    environment:
      SESAME_API_ADDR: 0.0.0.0:8787
      SESAME_API_VERSION: 0.1.0-selfhosted
      SESAME_ENV: development
      # The account portal is the origin that holds a session, so it is also
      # the origin the server puts in its account emails.
      SESAME_WEB_ORIGIN: ${SESAME_ACCOUNT_ORIGIN}
      SESAME_ADMIN_ORIGIN: ${SESAME_ADMIN_ORIGIN}
      # Optional. A public marketing site may read published metadata from this
      # origin, anonymously and with no unsafe method.
      SESAME_PUBLIC_SITE_ORIGIN: ${SESAME_PUBLIC_SITE_ORIGIN}
      SESAME_REGISTRATION_MODE: ${SESAME_REGISTRATION_MODE}
      # HTTP is allowed here because every origin above is loopback. A
      # deployment behind TLS sets both of these to true.
      SESAME_SESSION_SECURE: "false"
      SESAME_ADMIN_SESSION_SECURE: "false"
      SESAME_CAPABILITY_SIGNING_KEY: ${SESAME_CAPABILITY_SIGNING_KEY:?Run npm run setup first.}
      SESAME_ADMIN_ENCRYPTION_KEY: ${SESAME_ADMIN_ENCRYPTION_KEY:?Run npm run setup first.}
      SESAME_ADMIN_IP_PEPPER: ${SESAME_ADMIN_IP_PEPPER:?Run npm run setup first.}
      SESAME_SMTP_ADDR: mailpit:1025
      SESAME_SMTP_FROM: Sesame <accounts@localhost>
      SESAME_SMTP_ALLOW_INSECURE_LOCAL: "true"
      DATABASE_URL: postgres://sesame:${SESAME_DATABASE_PASSWORD}@db:5432/sesame?sslmode=disable
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  account:
    build:
      context: ${SESAME_ACCOUNT_CONTEXT}
      args:
        VITE_SESAME_API_URL: ${SESAME_API_ORIGIN}
        VITE_SESAME_SITE_ORIGIN: ${SESAME_SITE_ORIGIN}
        VITE_SESAME_CAPABILITY_PUBLIC_KEY: ${SESAME_CAPABILITY_PUBLIC_KEY}
    ports:
      - "127.0.0.1:4175:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: ${SESAME_ADMIN_CONTEXT}
      args:
        VITE_SESAME_API_URL: ${SESAME_API_ORIGIN}
    ports:
      - "127.0.0.1:4174:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.15.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sesame
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: ${SESAME_DATABASE_PASSWORD:?Run npm run setup first.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # PostgreSQL 18 images store data in a major-version subdirectory, so the
      # mount belongs one level up. Mounting .../data instead makes the
      # container refuse to start with an upgrade warning.
      - database:/var/lib/postgresql
    restart: unless-stopped

volumes:
  database:
