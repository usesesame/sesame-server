name: Server CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sesame_test
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesame -d sesame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESAME_TEST_DATABASE_URL: postgres://sesame:sesame-test-only@127.0.0.1:5432/sesame_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      - run: npm run test:race

      - run: npm run vuln:check

  # Both portals ship from this repository, so this workflow is the only thing
  # that can gate them. Their own nested workflow files never ran: GitHub reads
  # workflows from the repository root alone.
  account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/account
    env:
      VITE_SESAME_API_URL: https://api.test.invalid
      VITE_SESAME_SITE_ORIGIN: https://website.test.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/account/.node-version
          cache: npm
          cache-dependency-path: web/account/package-lock.json

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      - run: npm test

      # `ci` stops at the type check, so without this a bundling failure would
      # first appear on the deployed server.
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    env:
      VITE_SESAME_API_URL: https://api.test.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/admin/.node-version
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      # `ci` stops at the type check, so the portal tests would otherwise never
      # run in this workflow.
      - run: npm test

      - run: npm run build

  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/console/.node-version
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: npm ci
        working-directory: web/console

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: web/console

      - run: npm run release:check
        working-directory: web/console

      - run: npm run selfhost:smoke -- --skip-console-build

  selfhost-image:
    runs-on: ubuntu-latest
    env:
      SESAME_RELEASE_VERSION: 0.0.0-ci
      SESAME_RELEASE_COMMIT: ${{ github.sha }}
      SELFHOST_AMD64_IMAGE: sesame-selfhost:ci-amd64
      SELFHOST_ARM64_IMAGE: sesame-selfhost:ci-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build both platforms
        run: node scripts/build-selfhost-images.mjs

      - name: Run the amd64 image
        run: node scripts/selfhost-image-check.mjs --image "$SELFHOST_AMD64_IMAGE" --arch amd64 --version "$SESAME_RELEASE_VERSION" --commit "$SESAME_RELEASE_COMMIT" --run

      - name: Run the arm64 image under emulation
        run: node scripts/selfhost-image-check.mjs --image "$SELFHOST_ARM64_IMAGE" --arch arm64 --version "$SESAME_RELEASE_VERSION" --commit "$SESAME_RELEASE_COMMIT" --run

      - run: docker save --output selfhost-image.tar "$SELFHOST_AMD64_IMAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selfhost-image-ci
          path: selfhost-image.tar
          retention-days: 1
          if-no-files-found: error

  selfhost-quickstart:
    needs: selfhost-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selfhost-image-ci

      - run: docker load --input selfhost-image.tar

      - name: Follow the quick start, backup and restore sections of SELF-HOSTING.md
        run: node scripts/selfhost-quickstart.mjs --mode local --image sesame-selfhost:ci-amd64

  selfhost-upgrade:
    needs: selfhost-image
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selfhost-image-ci

      - run: docker load --input selfhost-image.tar

      - name: Restart the new image over its own data
        run: node scripts/selfhost-upgrade-check.mjs --from sesame-selfhost:ci-amd64 --to sesame-selfhost:ci-amd64

      - name: Upgrade the latest published image over its own data and roll back
        run: node scripts/selfhost-upgrade-check.mjs --from-published --to sesame-selfhost:ci-amd64

  selfhost-proxy:
    needs: selfhost-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proxy: [caddy, nginx, traefik]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selfhost-image-ci

      - run: docker load --input selfhost-image.tar

      - name: Put the ${{ matrix.proxy }} recipe in front of the container
        run: node scripts/selfhost-proxy-check.mjs --image sesame-selfhost:ci-amd64 --proxy ${{ matrix.proxy }}

  release-images:
    runs-on: ubuntu-latest
    env:
      SESAME_RELEASE_VERSION: 0.0.0-ci
      SESAME_RELEASE_COMMIT: ${{ github.sha }}
      SESAME_RELEASE_API_ORIGIN: https://api.test.invalid
      SESAME_RELEASE_SITE_ORIGIN: https://website.test.invalid
      SESAME_RELEASE_CAPABILITY_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SESAME_API_IMAGE: sesame-api:ci
      SESAME_ACCOUNT_IMAGE: sesame-account:ci
      SESAME_ADMIN_IMAGE: sesame-admin:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: npm run release:images:build
