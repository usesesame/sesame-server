name: Server CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sesame_test
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesame -d sesame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESAME_TEST_DATABASE_URL: postgres://sesame:sesame-test-only@127.0.0.1:5432/sesame_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      - run: npm run test:race

      - run: npm run vuln:check

  # Both portals ship from this repository, so this workflow is the only thing
  # that can gate them. Their own nested workflow files never ran: GitHub reads
  # workflows from the repository root alone.
  account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/account
    env:
      VITE_SESAME_API_URL: https://api.test.invalid
      VITE_SESAME_SITE_ORIGIN: https://website.test.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/account/.node-version
          cache: npm
          cache-dependency-path: web/account/package-lock.json

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      - run: npm test

      # `ci` stops at the type check, so without this a bundling failure would
      # first appear on the deployed server.
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    env:
      VITE_SESAME_API_URL: https://api.test.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/admin/.node-version
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - run: npm run ci

      # `ci` stops at the type check, so the portal tests would otherwise never
      # run in this workflow.
      - run: npm test

      - run: npm run build

  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/console/.node-version
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: npm ci
        working-directory: web/console

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: web/console

      - run: npm run release:check
        working-directory: web/console

      - run: npm run selfhost:smoke -- --skip-console-build

  selfhost-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build both platforms
        run: |
          docker build --file Dockerfile.selfhost --platform linux/amd64 --tag sesame-selfhost:ci-amd64 .
          docker build --file Dockerfile.selfhost --platform linux/arm64 --tag sesame-selfhost:ci-arm64 .

      - run: node scripts/selfhost-image-check.mjs --image sesame-selfhost:ci-amd64 --arch amd64 --run
      - run: node scripts/selfhost-image-check.mjs --image sesame-selfhost:ci-arm64 --arch arm64
