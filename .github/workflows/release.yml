name: Server release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      commit: ${{ steps.contract.outputs.commit }}
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sesame_test
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesame -d sesame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESAME_TEST_DATABASE_URL: postgres://sesame:sesame-test-only@127.0.0.1:5432/sesame_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - id: contract
        run: node scripts/release-contract.mjs github "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci
      - run: npm run ci
      - run: npm run test:race
      - run: npm run vuln:check

      - run: npm ci
        working-directory: web/account
      - run: npm run release:check
        working-directory: web/account
        env:
          VITE_SESAME_API_URL: https://api.test.invalid
          VITE_SESAME_SITE_ORIGIN: https://website.test.invalid

      - run: npm ci
        working-directory: web/admin
      - run: npm run release:check
        working-directory: web/admin
        env:
          VITE_SESAME_API_URL: https://api.test.invalid
      - run: npm test
        working-directory: web/admin
        env:
          VITE_SESAME_API_URL: https://api.test.invalid

      - run: npm run compose:config

  images:
    needs: verify
    runs-on: ubuntu-latest
    environment: server-release
    permissions:
      contents: read
    outputs:
      version: ${{ needs.verify.outputs.version }}
      commit: ${{ needs.verify.outputs.commit }}
      images_sha256: ${{ steps.digests.outputs.images_sha256 }}
      api_sbom_sha256: ${{ steps.digests.outputs.api_sbom_sha256 }}
      account_sbom_sha256: ${{ steps.digests.outputs.account_sbom_sha256 }}
      admin_sbom_sha256: ${{ steps.digests.outputs.admin_sbom_sha256 }}
    env:
      SESAME_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      SESAME_RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      SESAME_RELEASE_SOURCE_URL: https://github.com/${{ github.repository }}
      SESAME_RELEASE_API_ORIGIN: ${{ vars.SESAME_API_ORIGIN }}
      SESAME_RELEASE_SITE_ORIGIN: ${{ vars.SESAME_PUBLIC_SITE_ORIGIN }}
      SESAME_RELEASE_CAPABILITY_PUBLIC_KEY: ${{ vars.SESAME_CAPABILITY_PUBLIC_KEY }}
      SESAME_API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ needs.verify.outputs.version }}
      SESAME_ACCOUNT_IMAGE: ghcr.io/${{ github.repository }}-account:${{ needs.verify.outputs.version }}
      SESAME_ADMIN_IMAGE: ghcr.io/${{ github.repository }}-admin:${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - run: npm run release:images:build

      - run: npm run compose:smoke

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.SESAME_API_IMAGE }}
          format: spdx-json
          output-file: api.spdx.json
          upload-artifact: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.SESAME_ACCOUNT_IMAGE }}
          format: spdx-json
          output-file: account.spdx.json
          upload-artifact: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.SESAME_ADMIN_IMAGE }}
          format: spdx-json
          output-file: admin.spdx.json
          upload-artifact: false

      - run: docker save --output release-images.tar "$SESAME_API_IMAGE" "$SESAME_ACCOUNT_IMAGE" "$SESAME_ADMIN_IMAGE"

      - id: digests
        name: Record the release artifact digests
        run: |
          set -euo pipefail
          record() {
            local name="$1" file="$2" digest
            digest=$(sha256sum -- "$file" | cut -d ' ' -f 1)
            printf '%s=%s\n' "$name" "$digest" >> "$GITHUB_OUTPUT"
          }
          record images_sha256 release-images.tar
          record api_sbom_sha256 api.spdx.json
          record account_sbom_sha256 account.spdx.json
          record admin_sbom_sha256 admin.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-images-${{ needs.verify.outputs.version }}
          path: |
            release-images.tar
            api.spdx.json
            account.spdx.json
            admin.spdx.json
          if-no-files-found: error

  publish:
    needs: images
    runs-on: ubuntu-latest
    environment: server-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      API_REPOSITORY: ghcr.io/${{ github.repository }}-api
      ACCOUNT_REPOSITORY: ghcr.io/${{ github.repository }}-account
      ADMIN_REPOSITORY: ghcr.io/${{ github.repository }}-admin
      SESAME_RELEASE_VERSION: ${{ needs.images.outputs.version }}
      SESAME_RELEASE_COMMIT: ${{ needs.images.outputs.commit }}
      SESAME_API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ needs.images.outputs.version }}
      SESAME_ACCOUNT_IMAGE: ghcr.io/${{ github.repository }}-account:${{ needs.images.outputs.version }}
      SESAME_ADMIN_IMAGE: ghcr.io/${{ github.repository }}-admin:${{ needs.images.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-images-${{ needs.images.outputs.version }}

      - name: Verify the release artifact digests
        env:
          EXPECTED_IMAGES_SHA256: ${{ needs.images.outputs.images_sha256 }}
          EXPECTED_API_SBOM_SHA256: ${{ needs.images.outputs.api_sbom_sha256 }}
          EXPECTED_ACCOUNT_SBOM_SHA256: ${{ needs.images.outputs.account_sbom_sha256 }}
          EXPECTED_ADMIN_SBOM_SHA256: ${{ needs.images.outputs.admin_sbom_sha256 }}
        run: |
          set -euo pipefail
          verify() {
            local file="$1" expected="$2" actual
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "release digest for $file is malformed: expected 64 lowercase hex characters" >&2
              exit 1
            fi
            actual=$(sha256sum -- "$file" | cut -d ' ' -f 1)
            if [[ "$actual" != "$expected" ]]; then
              echo "release digest mismatch for $file: expected $expected, got $actual" >&2
              exit 1
            fi
          }
          verify release-images.tar "$EXPECTED_IMAGES_SHA256"
          verify api.spdx.json "$EXPECTED_API_SBOM_SHA256"
          verify account.spdx.json "$EXPECTED_ACCOUNT_SBOM_SHA256"
          verify admin.spdx.json "$EXPECTED_ADMIN_SBOM_SHA256"

      - run: docker load --input release-images.tar

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        run: |
          docker push "$SESAME_API_IMAGE"
          docker push "$SESAME_ACCOUNT_IMAGE"
          docker push "$SESAME_ADMIN_IMAGE"
          api_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SESAME_API_IMAGE")
          account_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SESAME_ACCOUNT_IMAGE")
          admin_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SESAME_ADMIN_IMAGE")
          echo "api_ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "account_ref=$account_ref" >> "$GITHUB_OUTPUT"
          echo "admin_ref=$admin_ref" >> "$GITHUB_OUTPUT"
          echo "api_digest=${api_ref##*@}" >> "$GITHUB_OUTPUT"
          echo "account_digest=${account_ref##*@}" >> "$GITHUB_OUTPUT"
          echo "admin_digest=${admin_ref##*@}" >> "$GITHUB_OUTPUT"

      - run: node scripts/release-contract.mjs manifest "$SESAME_RELEASE_VERSION" "$SESAME_RELEASE_COMMIT" "${{ steps.push.outputs.api_ref }}" "${{ steps.push.outputs.account_ref }}" "${{ steps.push.outputs.admin_ref }}" server-release.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.api_digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.api_digest }}
          sbom-path: api.spdx.json
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.ACCOUNT_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.account_digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.ACCOUNT_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.account_digest }}
          sbom-path: account.spdx.json
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.ADMIN_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.admin_digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.ADMIN_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.admin_digest }}
          sbom-path: admin.spdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-release-${{ needs.images.outputs.version }}
          path: |
            server-release.json
            api.spdx.json
            account.spdx.json
            admin.spdx.json
          if-no-files-found: error

      - name: Publish the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$SESAME_RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "v$SESAME_RELEASE_VERSION" --title "Sesame server $SESAME_RELEASE_VERSION" --notes "server-release.json carries the digest references the deploy tool consumes. Provenance attestations live on the images."
          gh release upload "v$SESAME_RELEASE_VERSION" server-release.json api.spdx.json account.spdx.json admin.spdx.json --clobber
