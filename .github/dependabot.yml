version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Both portals ship from this repository and carry their own lockfile and
  # Dockerfile. A directory entry is per manifest, so the root entries above do
  # not reach them.
  - package-ecosystem: npm
    directory: /web/account
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The API and both portal images. A base image is as much a dependency as a
  # module, and nothing else here moves those tags.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /web/account
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /web/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Every third-party action here is pinned to a full commit SHA. Dependabot is
  # the only thing that moves those pins, so this entry is a security control.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
